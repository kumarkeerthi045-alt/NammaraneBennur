org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disabled after a "Could not close incremental caches" failure during the
# first real release build - the corrupted cache came from a build that was
# interrupted by a full disk. Incremental compilation makes rebuilds faster
# but is what corrupts under interruption; disabling it trades some rebuild
# speed for reliability. Safe to remove/re-enable once builds are stable.
kotlin.incremental=false
